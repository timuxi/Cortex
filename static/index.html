<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex</title>
    <script src="https://cdn.staticfile.net/marked/12.0.2/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #131314; --text-color: #e3e3e3; --input-bg: #1e1f20;
            --border-color: #444746; --btn-hover: #333537;
            --think-bg: #1a1a1c; --think-border: #333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; }
        .header-left .title { font-size: 22px; font-weight: 600; }
        .header-left .subtitle { font-size: 12px; color: #888; margin-top: 4px; }
        .header-right a { color: var(--text-color); }
        .header-right svg { width: 28px; height: 28px; fill: currentColor; }
        main { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .chat-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 24px; padding-bottom: 40px; }
        .message { display: flex; gap: 16px; align-items: flex-start; }
        .message.user { flex-direction: row-reverse; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; flex-shrink: 0; font-size: 20px; }
        .message.bot .avatar { background: #6b4c9a; color: #fff; }
        .message.user .avatar { background: #444; color: #fff; }
        .content { font-size: 15px; line-height: 1.6; max-width: 85%; word-wrap: break-word; }
        .message.user .content { background: var(--input-bg); padding: 12px 18px; border-radius: 20px; }
        .think-block { background: var(--think-bg); border-left: 3px solid #6b4c9a; padding: 12px; margin-bottom: 12px; border-radius: 4px; color: #aaa; font-size: 14px; }
        .think-block summary { cursor: pointer; user-select: none; font-weight: 500; color: #ccc;}
        .think-block summary:hover { color: #fff; }
        footer { padding: 10px 20px 20px; display: flex; flex-direction: column; align-items: center; background: linear-gradient(180deg, rgba(19,19,20,0) 0%, rgba(19,19,20,1) 30%); }
        .input-wrapper { width: 100%; max-width: 800px; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; transition: 0.2s; }
        .input-wrapper:focus-within { background-color: #282a2c; }
        textarea { width: 100%; background: transparent; border: none; color: var(--text-color); font-size: 16px; font-family: inherit; resize: none; outline: none; min-height: 24px; max-height: 200px; overflow-y: auto; line-height: 1.5; }
        .bottom-controls { display: flex; justify-content: space-between; align-items: center; }
        .left-controls { display: flex; gap: 8px; }
        .control-btn { background: transparent; border: none; color: #aaa; font-size: 13px; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 16px; transition: 0.2s; }
        .control-btn:hover { background: var(--btn-hover); color: #fff; }
        .control-btn.think-btn.active { color: #bca0ff; background: rgba(188, 160, 255, 0.1); }
        .send-btn { background: #fff; color: #000; border: none; border-radius: 50%; width: 36px; height: 36px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; }
        .send-btn:hover { opacity: 0.8; }
        .send-btn:disabled { background: #555; cursor: not-allowed; }
        .send-btn svg { width: 18px; height: 18px; fill: currentColor; }
        .footer-text { font-size: 12px; color: #777; margin-top: 12px; text-align: center; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal { background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; width: 320px; }
        .modal h3 { margin-bottom: 16px; font-size: 18px; }
        .setting-group { margin-bottom: 16px; }
        .setting-group label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: #ccc;}
        .setting-group input[type="range"] { width: 100%; accent-color: #bca0ff; }
        .modal-footer { display: flex; justify-content: flex-end; margin-top: 24px; }
        .btn-primary { background: #e3e3e3; color: #000; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div class="title">Cortex</div>
            <div class="subtitle">Model: Cortex 3.0 GV: 42/60</div>
        </div>
        <div class="header-right">
            <a href="https://github.com/qibin0506/Cortex" target="_blank">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
            </a>
        </div>
    </header>

    <main id="chat-container">
        <div class="chat-container" id="chat-box">
            <div class="message bot">
                <div class="avatar">🤖</div>
                <div class="content">你好！我是Cortex。我们开始聊天吧！</div>
            </div>
        </div>
    </main>

    <footer>
        <div class="input-wrapper">
            <textarea id="user-input" rows="1" placeholder="在这里输入消息..."></textarea>
            <div class="bottom-controls">
                <div class="left-controls">
                    <button class="control-btn think-btn active" id="btn-think">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>深度思考
                    </button>
                    <button class="control-btn" id="btn-params">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>参数
                    </button>
                </div>
                <button class="send-btn" id="btn-send"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg></button>
            </div>
        </div>
        <div class="footer-text">AI可能会犯错。请核查重要信息。</div>
    </footer>

    <div class="modal-overlay" id="params-modal">
        <div class="modal">
            <h3>模型参数设置</h3>
            <div class="setting-group"><label><span>Temperature</span> <span id="val-temp">0.7</span></label><input type="range" id="input-temp" min="0" max="2" step="0.1" value="0.7"></div>
            <div class="setting-group"><label><span>Top P</span> <span id="val-topp">0.9</span></label><input type="range" id="input-topp" min="0" max="1" step="0.05" value="0.9"></div>
            <div class="setting-group"><label><span>Top K</span> <span id="val-topk">40</span></label><input type="range" id="input-topk" min="1" max="100" step="1" value="40"></div>
            <div class="modal-footer"><button class="btn-primary" id="btn-close-modal">完成</button></div>
        </div>
    </div>

    <script>
        let isThink = true;
        let params = { temperature: 0.7, top_p: 0.9, top_k: 40 };

        let chatHistory = [];

        const elInput = document.getElementById('user-input');
        const elBtnSend = document.getElementById('btn-send');
        const elBtnThink = document.getElementById('btn-think');
        const elBtnParams = document.getElementById('btn-params');
        const elChatBox = document.getElementById('chat-box');
        const elMain = document.getElementById('chat-container');
        const elModal = document.getElementById('params-modal');
        const elBtnCloseModal = document.getElementById('btn-close-modal');
        const [inTemp, inTopP, inTopK] = ['input-temp', 'input-topp', 'input-topk'].map(id => document.getElementById(id));
        const [valTemp, valTopP, valTopK] = ['val-temp', 'val-topp', 'val-topk'].map(id => document.getElementById(id));

        elInput.addEventListener('input', function() { this.style.height = '24px'; this.style.height = Math.min(this.scrollHeight, 200) + 'px'; });
        elInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }});
        elBtnSend.addEventListener('click', sendMessage);
        elBtnThink.addEventListener('click', () => { isThink = !isThink; elBtnThink.classList.toggle('active', isThink); });
        elBtnParams.addEventListener('click', () => elModal.style.display = 'flex');
        elBtnCloseModal.addEventListener('click', () => elModal.style.display = 'none');
        elModal.addEventListener('click', (e) => { if (e.target === elModal) elModal.style.display = 'none'; });
        inTemp.addEventListener('input', (e) => { params.temperature = e.target.value; valTemp.innerText = e.target.value; });
        inTopP.addEventListener('input', (e) => { params.top_p = e.target.value; valTopP.innerText = e.target.value; });
        inTopK.addEventListener('input', (e) => { params.top_k = e.target.value; valTopK.innerText = e.target.value; });

        async function sendMessage() {
            const content = elInput.value.trim();
            if (!content) return;

            const currentIsThink = isThink;
            appendMessage('user', content);

            chatHistory.push({ role: 'user', content: content });

            elInput.value = '';
            elInput.style.height = '24px';
            elBtnSend.disabled = true;

            const botMsgContainer = appendMessage('bot', '');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: chatHistory,
                        is_think: currentIsThink,
                        temperature: parseFloat(params.temperature),
                        top_p: parseFloat(params.top_p),
                        top_k: parseInt(params.top_k)
                    })
                });

                if (!response.ok) throw new Error("网络请求失败");

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let fullText = "";
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    let boundary = buffer.indexOf('\n\n');

                    while (boundary !== -1) {
                        let chunkStr = buffer.slice(0, boundary);
                        buffer = buffer.slice(boundary + 2);

                        if (chunkStr.startsWith('data: ')) {
                            let dataStr = chunkStr.slice(6).trim();

                            if (dataStr === '[DONE]') {
                                let botTextToSave = fullText;
                                if (currentIsThink && !botTextToSave.startsWith('<think>')) {
                                    botTextToSave = '<think>' + botTextToSave;
                                }
                                chatHistory.push({ role: 'assistant', content: botTextToSave });
                                continue;
                            }

                            try {
                                const data = JSON.parse(dataStr);
                                fullText += data.delta;
                                renderText(fullText, botMsgContainer, currentIsThink);
                                elMain.scrollTop = elMain.scrollHeight;
                            } catch (err) {
                                console.error("JSON 解析错误", err, dataStr);
                            }
                        }
                        boundary = buffer.indexOf('\n\n');
                    }
                }
            } catch (err) {
                renderText("请求出错: " + err.message, botMsgContainer, currentIsThink);
                chatHistory.pop();
            } finally {
                elBtnSend.disabled = false;
                elInput.focus();
            }
        }

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.innerText = role === 'bot' ? '🤖' : '👤';
            const contentDiv = document.createElement('div');
            contentDiv.className = 'content';
            if (text) renderText(text, contentDiv, false);
            div.appendChild(avatar);
            div.appendChild(contentDiv);
            elChatBox.appendChild(div);
            elMain.scrollTop = elMain.scrollHeight;
            return contentDiv;
        }

        function renderText(text, container, isThinkMode) {
            let processedText = text;
            if (isThinkMode && !processedText.startsWith('<think>')) {
                processedText = '<think>' + processedText;
            }

            processedText = processedText.replace(/<think>([\s\S]*?)<\/think>/g, '<details class="think-block" open><summary>思考过程</summary>\n\n$1\n\n</details>');
            processedText = processedText.replace(/<think>([\s\S]*?)$/g, '<details class="think-block" open><summary>思考中...</summary>\n\n$1\n\n</details>');
            processedText = processedText.replace(/<\/think>/g, '');
            processedText = processedText.replace(/<answer>/g, '');
            container.innerHTML = marked.parse(processedText);
        }
    </script>
</body>
</html>
